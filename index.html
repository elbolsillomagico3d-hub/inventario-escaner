<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Mi Inventario</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial;
  background: #f5f5f5;
  text-align: center;
  padding: 20px;
}

#reader {
  max-width: 450px;
  margin: auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

#producto {
  display: none;
  background: white;
  padding: 20px;
  margin: 20px auto;
  border-radius: 15px;
  max-width: 400px;
}

#foto {
  max-width: 180px;
  max-height: 180px;
}

button {
  font-size: 20px;
  padding: 15px 25px;
  margin: 8px;
  border: 0;
  border-radius: 10px;
  color: white;
}

#sumar {
  background: #28a745;
}

#restar {
  background: #dc3545;
}

#mensaje {
  font-weight: bold;
  margin: 20px;
}

</style>

</head>

<body>

<h1>📦 Mi Inventario</h1>

<div id="mensaje">
📷 Apunta al código de barras
</div>

<div id="reader"></div>

<div id="producto">

<img id="foto">

<h2 id="nombre"></h2>

<p>
Stock:
<strong id="stock"></strong>
</p>

<p>
Precio:
<strong id="precio"></strong> €
</p>

<button id="sumar">
➕ SUMAR
</button>

<button id="restar">
➖ RESTAR
</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxORNMWqtpXDx8RC8cRWcCTfn6Oa9G5c_kitHAmDtjFabdWeqSYpffP6r8XNuOEr5ujRg/exec";

let productoActual = null;

let contador = 0;


function mensaje(texto) {

  document.getElementById("mensaje")
    .textContent = texto;

}


function llamarAPI(url, funcion) {

  const script =
    document.createElement("script");

  const nombre =
    "respuestaAPI" + (++contador);

  window[nombre] = function(resultado) {

    funcion(resultado);

    delete window[nombre];

    script.remove();

  };

  script.src =
    url +
    "&callback=" +
    nombre;

  document.body.appendChild(script);
}


function buscarProducto(codigo) {

  mensaje("🔎 Buscando producto...");

  llamarAPI(

    API +
    "?codigo=" +
    encodeURIComponent(codigo),

    function(resultado) {

      if (!resultado.ok) {

        mensaje("❌ " + resultado.mensaje);

        return;

      }

      productoActual = resultado;

      document.getElementById("producto")
        .style.display = "block";

      document.getElementById("nombre")
        .textContent = resultado.producto;

      document.getElementById("stock")
        .textContent = resultado.stock;

      document.getElementById("precio")
        .textContent = resultado.precioVenta;

      if (resultado.foto) {

        document.getElementById("foto")
          .src = resultado.foto;

      }

      mensaje("✅ Producto encontrado");

    }

  );

}


function cambiarStock(cantidad) {

  if (!productoActual) return;

  mensaje("⏳ Actualizando stock...");

  llamarAPI(

    API +
    "?codigo=" +
    encodeURIComponent(productoActual.codigo) +
    "&accion=stock" +
    "&cantidad=" +
    cantidad,

    function(resultado) {

      if (!resultado.ok) {

        mensaje("❌ " + resultado.mensaje);

        return;

      }

      productoActual.stock =
        resultado.stock;

      document.getElementById("stock")
        .textContent = resultado.stock;

      mensaje("✅ Stock actualizado");

    }

  );

}


document.getElementById("sumar")
  .onclick = function() {

    cambiarStock(1);

  };


document.getElementById("restar")
  .onclick = function() {

    cambiarStock(-1);

  };


const scanner =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 150
      },

      rememberLastUsedCamera: true
    },

    false

  );


scanner.render(

  function(codigo) {

    scanner.clear();

    buscarProducto(codigo);

  },

  function() {}

);

</script>

</body>

</html>
